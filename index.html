<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim.ai PDF Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">PDF Analyzer</h1>

        <div id="upload-container" class="text-center">
            <div id="upload-zone" class="border p-5 mb-3">
                <p>Drag & Drop your PDF here or click to browse</p>
                <input type="file" id="pdf-upload" accept="application/pdf" hidden>
            </div>
            <div id="file-info" class="text-start" style="display: none;">
                <h5>File Details:</h5>
                <p>Name: <span id="file-name"></span></p>
                <p>Size: <span id="file-size"></span></p>
                <p>Pages: <span id="page-count"></span></p>
            </div>
            <div id="processing-progress" style="display: none;">
                <div class="progress mb-3">
                    <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
                <p>Processing page <span id="current-page">0</span> of <span id="total-pages">0</span>...</p>
                 <p id="status-message" class="text-muted"></p>
            </div>
        </div>

        <div id="results-container" style="display: none;">
            <h2 class="mt-5">Analysis Results</h2>
             <div class="input-group mb-3">
                <input type="text" id="search-input" class="form-control" placeholder="Search analysis text...">
                <button class="btn btn-outline-secondary" type="button" id="search-button">Search</button>
            </div>

            <div id="toc" class="mb-3">
                <h5>Table of Contents</h5>
                <ul id="toc-list" class="list-group list-group-flush"></ul>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <h5>PDF Page Image</h5>
                    <div id="pdf-viewer" class="border overflow-auto" style="height: 600px; position: relative;">
                         <img id="page-image" src="" alt="PDF Page" class="img-fluid" style="cursor: zoom-in;">
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <button id="prev-page" class="btn btn-secondary">Previous</button>
                        <span>Page <span id="current-page-display">1</span> / <span id="total-pages-display">1</span></span>
                         <input type="number" id="jump-to-page-input" min="1" style="width: 70px;" class="form-control d-inline-block mx-2">
                         <button id="jump-to-page-btn" class="btn btn-primary">Go</button>
                        <button id="next-page" class="btn btn-secondary">Next</button>
                    </div>
                     <div class="mt-2">
                        <button id="zoom-in" class="btn btn-outline-secondary btn-sm">+</button>
                        <button id="zoom-out" class="btn btn-outline-secondary btn-sm">-</button>
                        <button id="reset-zoom" class="btn btn-outline-secondary btn-sm">Reset</button>
                    </div>
                </div>
                <div class="col-md-6">
                    <h5>LLM Analysis</h5>
                    <div id="analysis-output" class="border p-3 overflow-auto" style="height: 600px;">
                        Loading analysis...
                    </div>
                     <div class="mt-3 text-end">
                        <button id="export-page-md" class="btn btn-info btn-sm">Export Page (MD)</button>
                        <button id="export-all-md" class="btn btn-primary btn-sm">Export All (MD)</button>
                        <button id="download-page-image" class="btn btn-success btn-sm">Download Page Image</button>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "pdfjs-dist": "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs",
          "pdfjs-dist/build/pdf.worker.min.mjs": "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
